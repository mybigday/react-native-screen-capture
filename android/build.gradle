// Deliberately no buildscript block: the Android Gradle Plugin and the React Native Gradle
// Plugin are already on the root project's classpath. Pinning a version here fights with
// whatever the host app resolves, which is the app author's call, not ours.

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def isNewArchitectureEnabled() {
  return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

apply plugin: "com.android.library"
if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

android {
  namespace "com.fugood.screencapture"

  compileSdk safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    // PixelCopy.request(Window, ...) is API 26; API 24-25 falls back to a Canvas draw.
    minSdk safeExtGet("minSdkVersion", 24)
    targetSdk safeExtGet("targetSdkVersion", 36)
    consumerProguardFiles "consumer-rules.pro"
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ["src/newarch/java"]
      } else {
        java.srcDirs += ["src/oldarch/java"]
      }
    }
  }

  lint {
    abortOnError false
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // Version is supplied by the host app's React Native gradle plugin.
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-android"
}
